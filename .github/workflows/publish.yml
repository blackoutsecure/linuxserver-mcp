name: Publish
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Package registry
        type: choice
        options: [npm, github]
        default: npm
      deploy_cloudflare:
        description: Also deploy the configured Worker and Pages project
        type: boolean
        default: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: ${{ inputs.registry == 'github' && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org' }}
          scope: '@blackoutsecure'
      - name: Validate Cloudflare configuration
        if: inputs.deploy_cloudflare
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Set the VITE_API_BASE_URL repository variable to the deployed Worker origin."
            exit 1
          fi
          if grep -Eq 'id = "default"' wrangler.toml; then
            echo "::error::Replace the placeholder KV namespace IDs before deploying."
            exit 1
          fi
      - run: npm ci
      - run: npm run release:check
      - run: npm run release:pack

      - name: Publish npm package
        if: inputs.registry == 'npm'
        run: npm publish --workspace=@blackoutsecure/linuxserver-mcp --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish GitHub package
        if: inputs.registry == 'github'
        run: npm publish --workspace=@blackoutsecure/linuxserver-mcp --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Cloudflare Worker
        if: inputs.deploy_cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Cloudflare Pages
        if: inputs.deploy_cloudflare
        run: npx wrangler pages deploy apps/web/dist --project-name=linuxserver-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
